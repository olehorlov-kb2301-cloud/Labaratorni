<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Оцінювання студента</title>
</head>
<body>
    <div>
        <label for="name"></label>
        <input type="text"  placeholder="name" name="name", id="name">

        <label for="company"></label>
        <input type="text" placeholder="email" name="email" id="email">

        <label for="company"></label>
        <input type="text" placeholder="company" name="company" id="company">
        <label for="submit"></label>
        <button id="submit">Submit</button>
    </div>
</body>
<script>

    fetch('https://jsonplaceholder.typicode.com/users')
        .then(response => response.json())
        .then(data => {

            data.forEach(post => {
                console.log(post);
            
        const f =  document.querySelector('body');

        const name = document.createElement('h1');
        const email = document.createElement('p');
        const company = document.createElement('h1');

        name.innerText = post.name;
        email.innerText = post.email;
        company.innerText = post.company;
        f.appendChild(name)
        })
    })

    
        const NameBlock = document.getElementById('name')
        const EmailBlock = document.getElementById('email')
        const CompanyBlock = document.getElementById('company')
        const sendBtn = document.getElementById('submit')

        sendBtn.addEventListener('click', () => {
            fetch('https://jsonplaceholder.typicode.com/users', {
                method: 'POST',
                body: JSON.stringify({
                    name: NameBlock.value,
                    email: EmailBlock.value,
                    company: CompanyBlock.value,
                })
            }).then(response => response.json())
              .then(data => {
                console.log(data);
              })
        })
            
    
</script>
</html>
