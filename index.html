<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Оцінювання студента</title>
</head>
<body>
    <header>
        <div class="title">Support</div>
    </header>
    <main class="content">
    
        <div class="div1">
            Registration
            <input id="username" type="text" placeholder="Username" required>  <!-- Строка введення ім'я (необов'язкова) -->
            <input id="email" type="email" placeholder="E-mail" required> <!-- Строка введення пошти (ов'язкова) -->
            <input id="password" type="password" placeholder="Password" required> <!-- Строка введення пошти (ов'язкова) -->
            <input id="conf" type="checkbox" required>
                <label for="conf"> Agreement with the terms of use</label><br> <!-- Галочка згоди з умовами використування -->
            <button id="Submit_button" type="submit">Submit</button> <!-- Кнопка відправки форми -->
        </div>
    </main>
    
    <footer>FOOTER @2026</footer>

    <script src="script.js"></script>

</body>
</html>
