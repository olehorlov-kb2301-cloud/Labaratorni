<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Support</title>
</head>
<body>

    <header>
        <div class="title">Support</div>
    </header>
    <main class="content">
        <div class="div1">
            Form
            <input id="textblock" type="text" placeholder="Name">
            <input id="textblock" type="email" placeholder="E-mail" required>
            <div1 class="textarea-wrapper">
                <textarea id="text-area" maxlength="300" placeholder="Description of problem" required></textarea>
                <div id="char-count">0 / 300</div>
            </div1>
            <input id="conf" type="checkbox" required>
                <label for="conf"> Agreement with the terms of use</label><br>
            <button onclick="alert('Надіслано')" type="submit">Submit</button>

        </div>
    </main>
    <script>
        const textarea = document.getElementById("text-area");
        const charCount = document.getElementById("char-count");

        textarea.addEventListener("input", () => {
            const currentLength = textarea.value.length;
            charCount.textContent = `${currentLength} / 300`;
    });
    </script>

    <footer>FOOTER @2026</footer>
</body>
</html>
